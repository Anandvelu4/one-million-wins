<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>ONE MILLION WINS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23e6c36a'/%3E%3C/svg%3E">
<style>
  :root{
    --midnight:#0b1020;
    --slate:#151b2e;
    --line:#252d45;
    --mist:#9aa5c0;
    --ivory:#f4efe3;
    --gold:#e6c36a;
    --gold-deep:#caa44a;
    --coral:#e58b7b;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 70% at 50% 0%,#141b33 0%,var(--midnight) 60%);
    color:var(--ivory);
    font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main{
    max-width:520px;margin:0 auto;min-height:100%;
    display:flex;flex-direction:column;padding:28px 24px 20px;
  }
  .brand{
    text-align:center;font-size:.8rem;letter-spacing:.32em;color:var(--mist);font-weight:600;
  }

  /* hero counter */
  .hero{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    position:relative;padding:28px 0 12px;text-align:center;
  }
  .count{
    font-family:var(--serif);font-weight:400;line-height:1;
    font-size:min(8rem,24vw);
    font-variant-numeric:tabular-nums lining-nums;
    letter-spacing:-.01em;color:var(--ivory);
  }
  .count.m{font-size:min(7rem,19vw)}
  .count.l{font-size:min(5.5rem,13.5vw)}
  .count.neg{color:var(--coral)}
  .count.pulse{animation:pulse .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes pulse{
    0%{transform:scale(1);color:var(--ivory)}
    30%{transform:scale(1.05);color:var(--gold)}
    100%{transform:scale(1);color:var(--ivory)}
  }
  .count-label{margin-top:14px;color:var(--mist);font-size:.95rem}
  .fly{
    position:absolute;left:50%;top:36%;color:var(--gold);font-family:var(--serif);font-size:1.6rem;
    pointer-events:none;transform:translateX(-50%);animation:fly .8s ease-out forwards;
  }
  @keyframes fly{
    from{opacity:1;transform:translate(-50%,0)}
    to{opacity:0;transform:translate(-50%,-56px)}
  }

  /* progress */
  .progress{margin:8px 0 22px}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .progress-row{display:flex;justify-content:space-between;margin-top:10px;font-size:.85rem;color:var(--mist)}

  .stats{display:flex;gap:12px;margin-bottom:22px}
  .stat{flex:1;background:var(--slate);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:1.7rem;font-variant-numeric:tabular-nums lining-nums}
  .stat span{font-size:.82rem;color:var(--mist)}

  /* the button */
  .win{
    width:100%;border:0;cursor:pointer;border-radius:22px;
    padding:26px 20px;background:linear-gradient(180deg,var(--gold),var(--gold-deep));
    color:#1a1405;font-family:var(--sans);font-weight:800;font-size:1.15rem;letter-spacing:.04em;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 10px 30px rgba(230,195,106,.18);
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
    touch-action:manipulation;
  }
  .win .plus{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1}
  .win:active{transform:scale(.97);box-shadow:0 4px 14px rgba(230,195,106,.14)}
  .win:disabled{filter:grayscale(1) brightness(.5);cursor:not-allowed}
  .win.flash{animation:flash .45s ease-out}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(230,195,106,.55)}
    100%{box-shadow:0 0 0 26px rgba(230,195,106,0)}
  }
  :focus-visible{outline:2px solid var(--ivory);outline-offset:3px}

  /* small tools */
  .tools{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}
  .tool{
    background:transparent;border:1px solid var(--line);color:var(--mist);
    font:inherit;font-size:.82rem;padding:9px 14px;border-radius:99px;cursor:pointer;
  }
  .tool:hover{color:var(--ivory);border-color:var(--mist)}
  .tool:disabled{opacity:.4;cursor:not-allowed}

  .lapse{display:flex;justify-content:center;margin-top:10px}
  .gave{background:transparent;border:1px solid rgba(229,139,123,.4);color:var(--coral);font:inherit;font-size:.82rem;padding:9px 16px;border-radius:99px;cursor:pointer}
  .gave:hover{background:rgba(229,139,123,.08)}
  .gave:disabled{opacity:.4;cursor:not-allowed}

  /* status */
  .foot{margin-top:22px;text-align:center;font-size:.8rem;color:var(--mist);line-height:1.7}
  .status{display:inline-flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:#6fcf97}
  .status.bad{color:var(--coral)}
  .status.bad .dot{background:var(--coral)}

  /* toast + modal */
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--slate);border:1px solid var(--line);color:var(--ivory);
    padding:12px 18px;border-radius:12px;font-size:.9rem;max-width:90vw;text-align:center;z-index:40;
  }
  .scrim{position:fixed;inset:0;background:rgba(4,6,12,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:30}
  .dialog{background:var(--slate);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:400px;width:100%;max-height:85vh;overflow:auto}
  .dialog h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin-bottom:10px}
  .dialog p{color:var(--mist);line-height:1.55;font-size:.95rem;white-space:pre-line}
  .dialog .row{display:flex;gap:10px;margin-top:22px}
  .dialog button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ivory)}
  .dialog button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405}
  .dialog button.danger{background:var(--coral);border-color:var(--coral);color:#2a0d08}


  /* ---- protection add-on ---- */
  .modebar{text-align:center;margin-top:12px;font-size:.78rem;color:var(--mist);white-space:pre-line}
  .modebar .sub{margin-top:8px;line-height:1.5}
  .chip{display:inline-block;padding:4px 12px;border-radius:99px;border:1px solid var(--line);letter-spacing:.14em;font-weight:700;font-size:.7rem}
  .chip.sleep{color:#9db0ff;border-color:#33407a}
  .chip.awake{color:#7bd6a3;border-color:#2b5c46}
  .chip.alert{color:#1a0b08;background:var(--coral);border-color:var(--coral)}
  .sos{width:100%;margin-top:12px;border:0;border-radius:18px;padding:20px;background:#e5604f;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;letter-spacing:.04em;cursor:pointer;touch-action:manipulation}
  .sos:active{transform:scale(.97)}
  .sos.alert{animation:sosPulse 1.8s infinite}
  @keyframes sosPulse{0%{box-shadow:0 0 0 0 rgba(229,96,79,.6)}100%{box-shadow:0 0 0 18px rgba(229,96,79,0)}}
  .sheet{position:fixed;inset:0;background:var(--midnight);z-index:15;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .sheet-in{max-width:520px;margin:0 auto;padding:18px 22px 48px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .sheet-head h2{font-family:var(--serif);font-weight:400;font-size:1.35rem}
  .xbtn{background:transparent;border:1px solid var(--line);color:var(--mist);font:inherit;font-size:.85rem;padding:8px 14px;border-radius:99px;cursor:pointer}
  .sheet h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin:26px 0 10px;font-weight:600}
  .lead{color:var(--ivory);line-height:1.55;margin:10px 0 16px;white-space:pre-line}
  .note{color:var(--mist);font-size:.82rem;line-height:1.5;margin:8px 0}
  .warn{color:#e9c9a0;font-size:.82rem;line-height:1.5;margin:12px 0;padding:10px 12px;border:1px solid #5a4630;border-radius:10px}
  .eyebrow{color:var(--gold);letter-spacing:.16em;font-size:.75rem;font-weight:700;margin-bottom:10px;text-align:center}
  .bigbtn{display:block;width:100%;margin-top:14px;padding:20px;border:0;border-radius:18px;background:var(--slate);border:1px solid var(--line);color:var(--ivory);font:inherit;font-weight:800;font-size:1.05rem;letter-spacing:.03em;cursor:pointer;touch-action:manipulation}
  .bigbtn.go{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1a1405;border:0}
  .bigbtn.alt{background:transparent}
  .bigbtn:disabled{opacity:.35;cursor:not-allowed}
  .bigbtn:active{transform:scale(.98)}
  .clock{font-family:var(--serif);font-size:min(5.5rem,20vw);text-align:center;margin:18px 0;font-variant-numeric:tabular-nums}
  .clock.up{color:var(--coral);font-size:2.2rem}
  .reps{font-family:var(--serif);font-size:min(5rem,18vw);text-align:center;margin:12px 0;font-variant-numeric:tabular-nums}
  .exname{font-weight:800;font-size:1.3rem;text-align:center;margin-top:18px;letter-spacing:.03em}
  .ask{font-family:var(--serif);font-size:1.9rem;text-align:center;margin:40px 0 18px;line-height:1.25}
  .bar.big{height:8px}
  .steps{margin:8px 0}
  .step{display:flex;gap:12px;align-items:center;padding:14px;margin-top:10px;background:var(--slate);border:1px solid var(--line);border-radius:14px;line-height:1.4;cursor:pointer}
  .step input,.row2 input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
  .week{display:flex;gap:8px}
  .dayc{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--slate);border:1px solid var(--line);font-size:.8rem;color:var(--mist)}
  .dayc b{display:block;font-weight:600;margin-bottom:4px}
  .dayc span{font-size:1.1rem}
  .dayc.on-time{color:#7bd6a3;border-color:#2b5c46}.dayc.late{color:var(--gold)}.dayc.timeout,.dayc.open{color:var(--coral)}
  .hist .hrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mist)}
  .h-on-time{color:#7bd6a3}.h-late{color:var(--gold)}.h-timeout,.h-open{color:var(--coral)}
  .card{background:var(--slate);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.88rem;color:var(--mist)}
  .kv b{color:var(--ivory);font-weight:600;text-align:right}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .row2{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--mist);font-size:.9rem}
  .row2 .grow{flex:1;color:var(--ivory)}
  .tin{background:var(--slate);color:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.95rem}
  .grid21{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
  .tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--slate);border:1px solid var(--line);color:var(--mist);font-size:.9rem}
  .tile.hard{border-color:var(--coral);color:var(--coral);font-weight:700}
  .tile.past{opacity:.45}
  .tile.now{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:800}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<main>
  <div class="brand">ONE MILLION WINS</div>
  <div class="modebar" id="modebar"></div>

  <section class="hero" aria-live="polite">
    <div class="count" id="count">0</div>
    <div class="count-label">lifetime victories over urges</div>
  </section>

  <section class="progress">
    <div class="bar" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="1000000" aria-valuenow="0" aria-label="Progress toward 1,000,000 victories">
      <div class="fill" id="fill"></div>
    </div>
    <div class="progress-row"><span id="pct">0.0000%</span><span>Goal: 1,000,000</span></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="today">0</b><span>Today's victories</span></div>
    <div class="stat"><b id="alltime">0</b><span>All-time victories</span></div>
  </section>

  <button class="win" id="win" disabled>
    <span>I OVERCAME AN URGE</span>
    <span class="plus">+1</span>
  </button>

  <button class="sos" id="sos">I'M ABOUT TO GIVE IN</button>

  <div class="tools">
    <button class="tool" id="undo" disabled>Undo last win</button>
    <button class="tool" id="rewards" disabled>Bonuses</button>
    <button class="tool" id="export" disabled>EXPORT BACKUP</button>
    <button class="tool" id="import" disabled>IMPORT BACKUP</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>

  <div class="tools">
    <button class="tool" id="openChallenge">Get out of bed</button>
    <button class="tool" id="openRemind">Reminders</button>
    <button class="tool" id="openProt">21-day protection</button>
  </div>

  <div class="lapse">
    <button class="gave" id="gave" disabled>I gave in to an urge (&minus;4)</button>
  </div>

  <div class="foot">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
    <div id="lastBackup"></div>
  </div>
</main>

<div class="sheet" id="sh-sos" hidden></div>
<div class="sheet" id="sh-chal" hidden></div>
<div class="sheet" id="sh-remind" hidden></div>
<div class="sheet" id="sh-prot" hidden></div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="scrim" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mBody"></p>
    <div class="row">
      <button id="mCancel">Cancel</button>
      <button id="mOk" class="primary">Confirm</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------
     ONE MILLION WINS
     Everything is stored in this browser's IndexedDB on this device.
     No network, no accounts, no cloud, no Claude.
     Wins are only removed by "Undo last win" (accidental tap) or "I gave in" (permanent -4),
     both after confirmation.
     ------------------------------------------------------------ */

  const DB_NAME = 'OneMillionWinsDB';
  const DB_VERSION = 3;
  const STORE = 'wins';
  const ADJ = 'adjustments';   // bonus / penalty ledger
  const META = 'meta';
  const RULES = { weekBonus: 100, monthBonus: 500, weekPenalty: 50, slipLimit: 5, streakFrom: 3, streakPenalty: 50, milestones: [[3, 10000], [6, 50000], [9, 100000]] };
  const LAPSES = 'lapses';   // permanent record of every "I gave in" deduction
  const GOAL = 1000000;
  const LS_BACKUP = 'omw_last_backup';

  const $ = id => document.getElementById(id);
  const el = {
    count: $('count'), fill: $('fill'), bar: $('bar'), pct: $('pct'),
    today: $('today'), alltime: $('alltime'), win: $('win'),
    undo: $('undo'), rewards: $('rewards'), gave: $('gave'), exp: $('export'), imp: $('import'), file: $('file'),
    status: $('status'), statusText: $('statusText'), lastBackup: $('lastBackup'),
    toast: $('toast'), modal: $('modal'), mTitle: $('mTitle'), mBody: $('mBody'),
    mOk: $('mOk'), mCancel: $('mCancel'), hero: document.querySelector('.hero')
  };

  let db = null;
  let ready = false;
  let total = 0;      // points shown = winCount + adjSum
  let winCount = 0;
  let adjSum = 0;
  let today = 0;
  let currentDay = dayKey(new Date());

  /* ---------- helpers ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function newId() {
    let rand = '';
    try {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      const a = new Uint32Array(3); crypto.getRandomValues(a);
      rand = Array.from(a, x => x.toString(16).padStart(8, '0')).join('');
    } catch (e) {
      for (let i = 0; i < 3; i++) rand += Math.floor(Math.random() * 4294967296).toString(16).padStart(8, '0');
    }
    return Date.now().toString(36) + '-' + rand;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* settings only; safe to ignore */ } }

  function validRecord(r) {
    return !!r && typeof r.id === 'string' && r.id.length > 0 && r.id.length <= 100 &&
      typeof r.ts === 'string' && !isNaN(new Date(r.ts).getTime()) &&
      typeof r.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.day);
  }

  /* ---------- IndexedDB ---------- */
  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('This browser has no IndexedDB storage.'));
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(STORE)) {
          const s = d.createObjectStore(STORE, { keyPath: 'id' });
          s.createIndex('day', 'day');
          s.createIndex('ts', 'ts');
        }
        if (!d.objectStoreNames.contains(LAPSES)) d.createObjectStore(LAPSES, { keyPath: 'id' });
        if (!d.objectStoreNames.contains(ADJ)) d.createObjectStore(ADJ, { keyPath: 'id' });
        if (!d.objectStoreNames.contains(META)) d.createObjectStore(META, { keyPath: 'k' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('Could not open storage.'));
      req.onblocked = () => reject(new Error('Storage is blocked by another open tab. Close other tabs and reload.'));
    });
  }
  function reqP(r) {
    return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  function writeTx(fn) {
    // Resolves only when the transaction has fully committed to disk.
    return new Promise((resolve, reject) => {
      let tx;
      try { tx = db.transaction([STORE, LAPSES, ADJ, META], 'readwrite', { durability: 'strict' }); }
      catch (e) { tx = db.transaction([STORE, LAPSES, ADJ, META], 'readwrite'); }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Write failed.'));
      tx.onabort = () => reject(tx.error || new Error('Write was cancelled.'));
      fn(tx.objectStore(STORE), tx.objectStore(LAPSES), tx.objectStore(ADJ), tx.objectStore(META));
    });
  }
  const store = () => db.transaction(STORE).objectStore(STORE);
  const countAll = () => reqP(store().count());
  const countDay = d => reqP(store().index('day').count(IDBKeyRange.only(d)));
  const getAll = () => reqP(store().getAll());
  const getAllKeys = () => reqP(store().getAllKeys());
  function latest() {
    return new Promise((res, rej) => {
      const r = store().index('ts').openCursor(null, 'prev');
      r.onsuccess = () => res(r.result ? r.result.value : null);
      r.onerror = () => rej(r.error);
    });
  }

  function lastN(n) {
    return new Promise((res, rej) => {
      const out = [];
      const r = store().index('ts').openCursor(null, 'prev');
      r.onsuccess = () => {
        const c = r.result;
        if (c && out.length < n) { out.push(c.value); c.continue(); } else res(out);
      };
      r.onerror = () => rej(r.error);
    });
  }
  const getAllLapses = () => reqP(db.transaction(LAPSES).objectStore(LAPSES).getAll());
  function validLapse(l) {
    return !!l && typeof l.id === 'string' && l.id.length > 0 && typeof l.ts === 'string' && !isNaN(new Date(l.ts).getTime()) && Array.isArray(l.removedIds);
  }
  const vic = n => n === 1 ? 'victory' : 'victories';

  const getAllAdjustments = () => reqP(db.transaction(ADJ).objectStore(ADJ).getAll());
  const getMeta = k => reqP(db.transaction(META).objectStore(META).get(k));
  function validAdj(a) {
    return !!a && typeof a.id === 'string' && a.id.length > 0 && a.id.length <= 200 && Number.isInteger(a.points) &&
      typeof a.ts === 'string' && !isNaN(new Date(a.ts).getTime());
  }
  function earliestWinTs() {
    return new Promise((res, rej) => {
      const r = store().index('ts').openCursor(null, 'next');
      r.onsuccess = () => res(r.result ? r.result.value.ts : null);
      r.onerror = () => rej(r.error);
    });
  }
  const sign = n => (n > 0 ? '+' : n < 0 ? '\u2212' : '') + fmt(Math.abs(n));
  const mkDate = (y, m, d) => new Date(y, m, d);                 // local midnight
  const addDays = (d, n) => mkDate(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const startOfDay = d => mkDate(d.getFullYear(), d.getMonth(), d.getDate());
  const mondayOnOrAfter = d => { const x = startOfDay(d); const k = (x.getDay() + 6) % 7; return k === 0 ? x : addDays(x, 7 - k); };
  const mondayOnOrBefore = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };
  function addMonths(d, m) {
    const x = new Date(d.getTime()), day = x.getDate();
    x.setMonth(x.getMonth() + m);
    if (x.getDate() !== day) x.setDate(0);                       // e.g. 31 Aug + 3 months -> 30 Nov
    return x;
  }
  const shortDate = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

  // The tracking start only ever moves earlier, so awards stay stable.
  async function trackingStart(lapses) {
    const metaRow = await getMeta('start');
    const c = [];
    if (metaRow && typeof metaRow.ts === 'string') c.push(metaRow.ts);
    const fw = await earliestWinTs(); if (fw) c.push(fw);
    for (const l of lapses) c.push(l.ts);
    if (!c.length) c.push(new Date().toISOString());
    return { ts: c.reduce((a, b) => a < b ? a : b), metaRow };
  }

  /* Bonus / penalty rules. Awards have fixed ids, so they can never be given twice. */
  async function evaluateRewards() {
    const now = new Date();
    const todayStart = startOfDay(now);
    const lapses = (await getAllLapses()).filter(validLapse);
    const adj = await getAllAdjustments();
    const have = new Set(adj.map(a => a.id));
    const { ts: startTs, metaRow } = await trackingStart(lapses);
    if (!metaRow || startTs < metaRow.ts) await writeTx((s, l, a, m) => m.put({ k: 'start', ts: startTs }));
    const start = new Date(startTs);

    const slipDays = {};
    for (const l of lapses) slipDays[l.day] = (slipDays[l.day] || 0) + 1;
    const slipsIn = (from, to) => { let n = 0; for (let d = from; d < to; d = addDays(d, 1)) n += slipDays[dayKey(d)] || 0; return n; };

    const due = [];
    // complete Monday-Sunday weeks that began on/after tracking started
    for (let w = mondayOnOrAfter(start); addDays(w, 7) <= todayStart; w = addDays(w, 7)) {
      const end = addDays(w, 7), n = slipsIn(w, end);
      if (n === 0) due.push({ id: 'wk-bonus-' + dayKey(w), ts: end, points: RULES.weekBonus, kind: 'week-bonus', label: 'Clean week of ' + shortDate(w) });
      else if (n > RULES.slipLimit) due.push({ id: 'wk-penalty-' + dayKey(w), ts: end, points: -RULES.weekPenalty, kind: 'week-penalty', label: n + ' slips in week of ' + shortDate(w) });
    }
    // complete calendar months that began on/after tracking started
    let mo = mkDate(start.getFullYear(), start.getMonth(), 1);
    if (mo < startOfDay(start)) mo = mkDate(start.getFullYear(), start.getMonth() + 1, 1);
    for (; mkDate(mo.getFullYear(), mo.getMonth() + 1, 1) <= todayStart; mo = mkDate(mo.getFullYear(), mo.getMonth() + 1, 1)) {
      const next = mkDate(mo.getFullYear(), mo.getMonth() + 1, 1);
      if (slipsIn(mo, next) === 0) due.push({ id: 'mo-bonus-' + mo.getFullYear() + '-' + pad(mo.getMonth() + 1), ts: next, points: RULES.monthBonus, kind: 'month-bonus', label: 'Clean month: ' + mo.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) });
    }
    // 3 / 6 / 9 months since the last slip (or since tracking began)
    let since = start;
    for (const l of lapses) { const t = new Date(l.ts); if (t > since) since = t; }
    for (const [months, pts] of RULES.milestones) {
      const at = addMonths(since, months);
      if (at <= now) due.push({ id: 'ms-' + since.toISOString() + '-' + months, ts: at, points: pts, kind: 'milestone', label: months + ' months clean' });
    }

    const fresh = due.filter(d => !have.has(d.id)).sort((a, b) => a.ts - b.ts);
    if (!fresh.length) return [];
    let run = (await countAll()) + adj.reduce((t, a) => t + a.points, 0);
    const rows = [];
    for (const d of fresh) {
      let pts = d.points;
      // penalties apply in full; the score is allowed to go below zero
      run += pts;
      rows.push({ id: d.id, ts: d.ts.toISOString(), day: dayKey(d.ts), points: pts, kind: d.kind, label: d.label, v: 1 });
    }
    await writeTx((s, l, a) => { for (const r of rows) a.add(r); });
    await refreshCounts();
    setStatus(true);
    const shown = rows.filter(r => r.points !== 0), net = shown.reduce((t, r) => t + r.points, 0);
    if (shown.length === 1) toast(sign(shown[0].points) + ' \u00b7 ' + shown[0].label);
    else if (shown.length > 1) toast(shown.length + ' rewards applied (net ' + sign(net) + ')');
    if (net > 0) celebrateWin();
    return rows;
  }

  async function showRewards() {
    if (!ready) return;
    const now = new Date();
    const lapses = (await getAllLapses()).filter(validLapse);
    const adj = await getAllAdjustments();
    const have = new Set(adj.map(a => a.id));
    const { ts: startTs } = await trackingStart(lapses);
    const slipDays = {};
    for (const l of lapses) slipDays[l.day] = (slipDays[l.day] || 0) + 1;
    const wk = mondayOnOrBefore(now);
    let slips = 0; for (let i = 0; i < 7; i++) slips += slipDays[dayKey(addDays(wk, i))] || 0;
    let since = new Date(startTs);
    for (const l of lapses) { const t = new Date(l.ts); if (t > since) since = t; }
    const days = Math.max(0, Math.floor((startOfDay(now) - startOfDay(since)) / 86400000));
    const lines = ['This week: ' + slips + (slips === 1 ? ' slip' : ' slips') + (slips > RULES.slipLimit ? ' (penalty \u2212' + RULES.weekPenalty + ' when the week ends)' : ''),
      'Clean since ' + since.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + ' (' + days + (days === 1 ? ' day)' : ' days)'), ''];
    for (const [m, pts] of RULES.milestones) {
      const got = have.has('ms-' + since.toISOString() + '-' + m);
      lines.push((got ? '\u2713 ' : '\u2022 ') + m + ' months clean: ' + sign(pts) + (got ? '' : ' on ' + shortDate(addMonths(since, m)) + ' ' + addMonths(since, m).getFullYear()));
    }
    lines.push('', 'Rules', 'Clean week ' + sign(RULES.weekBonus) + ' \u00b7 Clean month ' + sign(RULES.monthBonus), 'More than ' + RULES.slipLimit + ' slips in a week ' + sign(-RULES.weekPenalty), 'Each slip also removes 4 (permanent)', 'From the ' + RULES.streakFrom + 'rd slip in a row (no victory between): extra \u2212' + RULES.streakPenalty + ' each');
    const recent = adj.filter(a => a.points !== 0 && a.kind !== 'lapse-extra').sort((a, b) => a.ts < b.ts ? 1 : -1).slice(0, 8);
    if (recent.length) { lines.push('', 'Recent'); for (const a of recent) lines.push(sign(a.points) + '  ' + (a.label || a.kind)); }
    await ask({ title: 'Bonuses', body: lines.join('\n'), ok: 'Close', single: true });
  }

  /* serialise all changes so rapid taps can never interleave */
  let chain = Promise.resolve();
  function enqueue(fn) {
    const p = chain.then(fn);
    chain = p.then(() => {}, () => {});
    return p;
  }

  /* ---------- UI ---------- */
  function render(celebrate) {
    el.count.textContent = fmt(total);
    const len = el.count.textContent.length;
    el.count.className = 'count' + (len > 7 ? ' l' : len > 5 ? ' m' : '') + (total < 0 ? ' neg' : '');
    el.today.textContent = fmt(today);
    el.alltime.textContent = fmt(total);
    const pct = Math.min(100, total / GOAL * 100);
    el.pct.textContent = pct.toFixed(4) + '% complete';
    el.fill.style.width = (total > 0 ? Math.max(pct, 0.6) : 0) + '%';
    el.bar.setAttribute('aria-valuenow', String(total));
    el.undo.disabled = !ready || winCount === 0;
    el.gave.disabled = !ready;
    if (celebrate) celebrateWin();
  }
  function celebrateWin() {
    el.count.classList.remove('pulse'); void el.count.offsetWidth; el.count.classList.add('pulse');
    el.win.classList.remove('flash'); void el.win.offsetWidth; el.win.classList.add('flash');
    const f = document.createElement('div');
    f.className = 'fly'; f.textContent = '+1';
    f.addEventListener('animationend', () => f.remove());
    el.hero.appendChild(f);
    setTimeout(() => f.remove(), 1200);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* optional */ }
  }
  function setStatus(ok, msg) {
    el.status.className = 'status' + (ok ? '' : ' bad');
    el.statusText.textContent = ok ? 'Achievements saved on this device.' : (msg || 'Not saved. Export a backup now.');
  }
  let toastTimer = null;
  function toast(text) {
    el.toast.textContent = text; el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.toast.hidden = true; }, 4200);
  }
  function renderBackupLine() {
    const iso = lsGet(LS_BACKUP);
    const d = iso ? new Date(iso) : null;
    el.lastBackup.textContent = d && !isNaN(d)
      ? 'Last backup: ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
      : 'No backup yet. Export one to keep a copy off this browser.';
  }
  function ask({ title, body, ok = 'Confirm', cancel = 'Cancel', danger = false, single = false }) {
    return new Promise(resolve => {
      el.mTitle.textContent = title; el.mBody.textContent = body;
      el.mOk.textContent = ok; el.mCancel.textContent = cancel;
      el.mOk.className = danger ? 'danger' : 'primary';
      el.mCancel.hidden = single;
      el.modal.hidden = false; (single ? el.mOk : el.mCancel).focus();
      const done = v => {
        el.modal.hidden = true; el.mCancel.hidden = false;
        el.mOk.onclick = el.mCancel.onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(v);
      };
      const onKey = e => { if (e.key === 'Escape') done(false); };
      document.addEventListener('keydown', onKey);
      el.mOk.onclick = () => done(true);
      el.mCancel.onclick = () => done(false);
    });
  }

  /* ---------- core actions ---------- */
  async function refreshCounts() {
    currentDay = dayKey(new Date());
    winCount = await countAll();
    adjSum = (await getAllAdjustments()).reduce((t, a) => t + (a.points || 0), 0);
    total = winCount + adjSum;
    today = await countDay(currentDay);
    render(false);
  }

  function recordWin() {
    if (!ready) return;
    const now = new Date();
    const rec = { id: newId(), ts: now.toISOString(), day: dayKey(now), tz: -now.getTimezoneOffset(), v: 1 };
    enqueue(async () => {
      await writeTx(s => s.add(rec));            // committed before we count it
      winCount += 1;
      total += 1;
      if (rec.day === currentDay) today += 1; else { await refreshCounts(); }
      render(true);
      setStatus(true);
    }).catch(err => {
      console.error(err);
      setStatus(false, 'NOT SAVED: ' + (err && err.message ? err.message : 'storage error') + '. Export a backup.');
      toast('That win could not be saved. Please try again.');
    });
  }

  async function undoLast() {
    if (!ready) return;
    let rec;
    try { rec = await latest(); } catch (e) { return toast('Could not read your records.'); }
    if (!rec) return toast('Nothing to undo.');
    const when = new Date(rec.ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    const yes = await ask({
      title: 'Remove your latest victory?',
      body: 'This removes the win recorded on ' + when + '.\nUse this only for an accidental tap. It cannot be restored unless you have a backup.',
      ok: 'Remove it', cancel: 'Keep it', danger: true
    });
    if (!yes) return;
    enqueue(async () => {
      await writeTx(s => s.delete(rec.id));
      await refreshCounts();
      setStatus(true);
      toast('Latest victory removed.');
    }).catch(err => { console.error(err); toast('Could not remove it. Nothing was changed.'); });
  }

  // How many slips in a row (no victory recorded in between) the NEXT slip would make.
  async function nextSlipStreak() {
    const lapses = (await getAllLapses()).filter(validLapse).sort((x, y) => x.ts < y.ts ? -1 : 1);
    const prev = lapses.length ? lapses[lapses.length - 1] : null;
    if (!prev) return 1;
    const winsSince = await reqP(store().index('ts').count(IDBKeyRange.lowerBound(prev.ts, true)));
    const prevStreak = Number.isInteger(prev.streak) && prev.streak >= 1 ? prev.streak : 1;
    return winsSince === 0 ? prevStreak + 1 : 1;
  }

  async function gaveIn() {
    if (!ready) return;
    const n = 4;                                   // a slip always costs 4; the score may go below zero
    let streak = 1;
    try { streak = await nextSlipStreak(); } catch (e) { /* treat as 1 */ }
    const pen = streak >= RULES.streakFrom ? RULES.streakPenalty : 0;
    const yes = await ask({
      title: 'Deduct your last ' + (n === 1 ? 'point' : n + ' points') + '?',
      body: 'You gave in, so ' + (n === 1 ? '1 point is' : n + ' points are') + ' removed.' +
        (streak >= RULES.streakFrom ? '\nThis is slip ' + streak + ' in a row with no victory in between. An extra \u2212' + pen + ' applies.' : '') +
        (total - n - pen < 0 ? '\nThis takes your score below zero.' : '') +
        '\nThis is permanent. It cannot be undone, and restoring a backup will not bring ' + (n === 1 ? 'it' : 'them') + ' back.',
      ok: 'Yes, deduct ' + (n + pen), cancel: 'Cancel', danger: true
    });
    if (!yes) return;
    enqueue(async () => {
      const take = 4;
      const st = await nextSlipStreak();
      const extraPen = st >= RULES.streakFrom ? RULES.streakPenalty : 0;
      const recent = await lastN(take);                 // newest win records first
      const extra = take - recent.length;               // remainder comes off earned bonus points
      const now = new Date();
      const lapse = { id: newId(), ts: now.toISOString(), day: dayKey(now), removedIds: recent.map(r => r.id), removedCount: recent.length, streak: st, v: 1 };
      const rows = [];
      if (extra > 0) rows.push({ id: 'lapse-extra-' + lapse.id, ts: lapse.ts, day: lapse.day, points: -extra, kind: 'lapse-extra', label: 'Gave in', v: 1 });
      if (extraPen > 0) rows.push({ id: 'streak-penalty-' + lapse.id, ts: lapse.ts, day: lapse.day, points: -extraPen, kind: 'streak-penalty', label: 'Gave in ' + st + ' times in a row', v: 1 });
      await writeTx((s, l, a) => { l.add(lapse); for (const r of recent) s.delete(r.id); for (const r of rows) a.add(r); });   // one atomic step
      await refreshCounts();
      setStatus(true);
      toast((take + extraPen) + ' points deducted' + (extraPen ? ' (' + take + ' + ' + extraPen + ' for ' + st + ' in a row)' : '') + '. The next one starts now.');
    }).catch(err => { console.error(err); toast('Could not record that. Nothing was changed.'); });
  }

  /* ---------- backup ---------- */
  async function exportBackup() {
    if (!ready) return;
    try {
      const all = await getAll();
      const lapseRows = (await getAllLapses()).filter(validLapse);
      const adjRows = (await getAllAdjustments()).filter(validAdj);
      const startRow = await getMeta('start');
      const good = [], bad = [];
      for (const r of all) (validRecord(r) ? good : bad).push(r);
      good.sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
      const daily = {};
      const achievements = good.map(r => {
        daily[r.day] = (daily[r.day] || 0) + 1;
        return { id: r.id, timestamp: r.ts, date: r.day, tzOffsetMinutes: typeof r.tz === 'number' ? r.tz : null };
      });
      const dailyTotals = {};
      Object.keys(daily).sort().forEach(k => { dailyTotals[k] = daily[k]; });
      const out = {
        app: 'ONE MILLION WINS',
        format: 1,
        exportedAt: new Date().toISOString(),
        goal: GOAL,
        lifetimeVictories: achievements.length + adjRows.reduce((t, a) => t + a.points, 0),   // total points incl. bonuses
        victoryRecords: achievements.length,
        trackingStart: startRow ? startRow.ts : null,
        dailyTotals,
        achievements,
        lapses: lapseRows.map(l => ({ id: l.id, timestamp: l.ts, date: l.day, removedCount: l.removedIds.length, removedIds: l.removedIds, streak: l.streak || 1 })),
        adjustments: adjRows.map(a => ({ id: a.id, timestamp: a.ts, date: a.day, points: a.points, kind: a.kind || '', label: a.label || '' }))
      };
      if (bad.length) out.unreadableRecords = bad;   // never silently dropped
      try { if (window.OMWPlus) out.plus = window.OMWPlus.exportData(); } catch (e) { /* optional add-on data */ }

      const now = new Date();
      const name = 'one-million-wins-backup-' + dayKey(now) + '_' + pad(now.getHours()) + pad(now.getMinutes()) +
        '-' + out.lifetimeVictories + 'wins.json';
      const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);

      lsSet(LS_BACKUP, now.toISOString());
      renderBackupLine();
      toast('Backup saved: ' + fmt(out.lifetimeVictories) + ' victories.' + (bad.length ? ' ' + bad.length + ' unreadable record(s) included separately.' : ''));
    } catch (err) {
      console.error(err);
      toast('Backup failed. Your achievements are untouched. Please try again.');
    }
  }

  function readFile(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result));
      fr.onerror = () => rej(fr.error || new Error('Could not read the file.'));
      fr.readAsText(file);
    });
  }

  function parseBackup(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('That file is not valid JSON.'); }
    if (!data || typeof data !== 'object' || data.app !== 'ONE MILLION WINS' || !Array.isArray(data.achievements)) {
      throw new Error('That is not a ONE MILLION WINS backup file.');
    }
    const seen = new Set(), valid = [];
    let invalid = 0;
    for (const a of data.achievements) {
      if (!a || typeof a.id !== 'string' || !a.id || a.id.length > 100 || typeof a.timestamp !== 'string') { invalid++; continue; }
      const t = new Date(a.timestamp);
      if (isNaN(t.getTime())) { invalid++; continue; }
      if (seen.has(a.id)) continue;               // duplicate inside the file itself
      seen.add(a.id);
      const day = (typeof a.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(a.date)) ? a.date : dayKey(t);
      const tz = (typeof a.tzOffsetMinutes === 'number' && isFinite(a.tzOffsetMinutes)) ? a.tzOffsetMinutes : -t.getTimezoneOffset();
      valid.push({ id: a.id, ts: t.toISOString(), day, tz, v: 1 });
    }
    const lapses = [];
    if (Array.isArray(data.lapses)) {
      for (const l of data.lapses) {
        if (!l || typeof l.id !== 'string' || !l.id || l.id.length > 100 || typeof l.timestamp !== 'string' || !Array.isArray(l.removedIds)) continue;
        const t = new Date(l.timestamp);
        if (isNaN(t.getTime())) continue;
        const ids = l.removedIds.filter(x => typeof x === 'string' && x && x.length <= 100);
        const day = (typeof l.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(l.date)) ? l.date : dayKey(t);
        lapses.push({ id: l.id, ts: t.toISOString(), day, removedIds: ids, removedCount: ids.length, streak: (Number.isInteger(l.streak) && l.streak >= 1 && l.streak <= 100000) ? l.streak : 1, v: 1 });
      }
    }
    const adjustments = [];
    if (Array.isArray(data.adjustments)) {
      for (const a of data.adjustments) {
        if (!a || typeof a.id !== 'string' || !a.id || a.id.length > 200 || !Number.isInteger(a.points) || Math.abs(a.points) > 10000000 || typeof a.timestamp !== 'string') continue;
        const t = new Date(a.timestamp);
        if (isNaN(t.getTime())) continue;
        const day = (typeof a.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(a.date)) ? a.date : dayKey(t);
        adjustments.push({ id: a.id, ts: t.toISOString(), day, points: a.points, kind: String(a.kind || '').slice(0, 30), label: String(a.label || '').slice(0, 120), v: 1 });
      }
    }
    let trackingStartTs = null;
    if (typeof data.trackingStart === 'string' && !isNaN(new Date(data.trackingStart).getTime())) trackingStartTs = new Date(data.trackingStart).toISOString();
    if (valid.length === 0 && lapses.length === 0 && adjustments.length === 0) throw new Error('That backup contains no valid achievements.');
    return { valid, invalid, declared: typeof data.victoryRecords === 'number' ? data.victoryRecords : data.lifetimeVictories, lapses, adjustments, trackingStartTs, plus: data.plus };
  }

  async function importBackup(file) {
    if (!ready || !file) return;
    try {
      const { valid, invalid, declared, lapses, adjustments, trackingStartTs, plus } = parseBackup(await readFile(file));
      const localLapses = await getAllLapses();
      const knownLapse = new Set(localLapses.map(l => l.id));
      const newLapses = lapses.filter(l => !knownLapse.has(l.id));
      const haveAdj = new Set((await getAllAdjustments()).map(a => a.id));
      const newAdj = adjustments.filter(a => !haveAdj.has(a.id));
      const metaRow = await getMeta('start');
      const newStart = trackingStartTs && (!metaRow || trackingStartTs < metaRow.ts) ? trackingStartTs : null;
      // Deducted wins stay deducted: ids from every lapse (here or in the file) are never re-added.
      const tomb = new Set();
      for (const l of localLapses.concat(newLapses)) for (const id of l.removedIds) tomb.add(id);
      const existing = new Set(await getAllKeys());
      const candidates = valid.filter(r => !tomb.has(r.id));
      const deducted = valid.length - candidates.length;
      const fresh = candidates.filter(r => !existing.has(r.id));
      const already = candidates.length - fresh.length;
      const toRemove = Array.from(existing).filter(id => tomb.has(id));

      if (fresh.length === 0 && newLapses.length === 0 && toRemove.length === 0 && newAdj.length === 0) {
        return toast(deducted
          ? 'Nothing to add. Victories you gave in on stay deducted.'
          : 'Nothing new. All ' + fmt(valid.length) + ' victories in this file are already here.');
      }
      const lines = [fmt(fresh.length) + ' new ' + vic(fresh.length) + ' will be added.'];
      if (already) lines.push(fmt(already) + ' already here will be skipped.');
      if (newAdj.length) lines.push(fmt(newAdj.length) + ' bonus/penalty ' + (newAdj.length === 1 ? 'entry' : 'entries') + ' (net ' + sign(newAdj.reduce((t, a) => t + a.points, 0)) + ' points) will be added.');
      if (deducted) lines.push(fmt(deducted) + ' in the file were deducted earlier and stay deducted.');
      if (toRemove.length) lines.push(fmt(toRemove.length) + ' you have now were deducted in this backup and will be removed.');
      lines.push(toRemove.length ? 'Nothing else you have will be changed or deleted.' : 'Nothing you already have will be changed or deleted.');
      if (invalid) lines.push(fmt(invalid) + ' unreadable entries in the file will be ignored.');
      if (typeof declared === 'number' && declared !== valid.length + invalid) lines.push('Note: the file\u2019s own total does not match its contents.');

  function sanitize(raw) {

    if (!raw || typeof raw !== 'object') return d;

  const saveHist = x => { if (x.challenges.length > 400) x.challenges = x.challenges.slice(-400); if (x.emergencies.length > 400) x.emergencies = x.emergencies.slice(-400); jset(KEY_H, x); };

  /* ---------------- schedule engine ---------------- */

      h('p', { class: 'note', id: 'chalRate', text: st.attempts ? st.onTime + ' of ' + st.attempts + ' on time in the last 30 days (' + Math.round(100 * st.onTime / st.attempts) + '%)' + (st.avg != null ? ' \u00b7 average ' + clock(st.avg * 1000) : '') : 'No attempts yet.' }));
    const hl = hist().challenges.slice(-12).reverse();
    nodes.push(h('h3', { text: 'History' }), hl.length ? h('div', { class: 'hist', id: 'chalHist' }, hl.map(c => h('div', { class: 'hrow' },
      h('span', { text: new Date(c.startedAt).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + fmtTime(c.startedAt) }), h('span', { class: 'h-' + c.status, text: chalLabel(c) })))) : h('p', { class: 'note', text: 'Nothing yet.' }));
    box.append(frame('Get out of bed', nodes));
    if (act) { chalTimer = setInterval(updChal, 250); }
  }
  function updChal() {
    const a = jget(KEY_C, null), el = $('chalClock'); if (!a || !el) return;
    const left = a.endAt - Date.now();
    if (left > 0) el.textContent = clock(left);
    else { el.textContent = "TIME'S UP"; el.classList.add('up'); chalNormalize(); clearInterval(chalTimer); }
  }
  function openChallenge(autostart) {
    openSheet('sh-chal');
    if (autostart && !activeChal()) chalStart();
    renderChal();
  }

  /* ---------------- EMERGENCY URGE MODE ---------------- */
  let em = null;
  function emLog(outcome) {
    if (!em) return;
    const H = hist(), e = H.emergencies.find(x => x.id === em.id);
    if (e) { e.outcome = outcome; saveHist(H); }
    em.logged = outcome;
  }
  function openSOS() {
    const H = hist(), id = 'e' + Date.now();
    H.emergencies.push({ id, ts: Date.now(), outcome: 'started' }); saveHist(H);
    em = { id, phase: 'ex', i: 0, reps: 0, done: false, final: false, logged: 'started' };
    openSheet('sh-sos');
    onCloseHook = () => { if (em && !em.final && em.logged === 'started') emLog('closed-early'); em = null; };
    renderSOS();
  }
  function emRun(endAt, onDone) {
    clearInterval(emTimer);
    const total = endAt - Date.now();
    const upd = () => {
      const left = endAt - Date.now();
      const c = $('emClock'), f = $('emFill');
      if (c) c.textContent = clock(left);
      if (f) f.style.width = Math.min(100, Math.max(0, 100 * (1 - left / total))) + '%';
      if (left <= 0) { clearInterval(emTimer); onDone(); }
    };
    emTimer = setInterval(upd, 250); upd();
  }
  const buzz = () => { try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) { /* optional */ } };
  function emSetPhase(p, extra) { Object.assign(em, { phase: p }, extra || {}); renderSOS(); }

  function renderSOS() {
    if (!em) return;
    clearInterval(emTimer);
    const box = $('sh-sos'); box.replaceChildren();
    const n = EX.length, nodes = [];
    const prog = frac => h('div', { class: 'bar big' }, h('div', { class: 'fill', id: 'emFill', style: 'width:' + Math.round(frac * 100) + '%' }));
    const overall = (em.i + (em.phase === 'ex' && em.done ? 1 : 0)) / n;

    if (em.phase === 'ex') {
      const ex = EX[em.i];
      nodes.push(h('div', { class: 'eyebrow', text: 'EXERCISE ' + (em.i + 1) + ' OF ' + n }), prog(overall),
        h('div', { class: 'exname', id: 'exName', text: ex.n }),
        h('div', { class: 'reps', id: 'repCount', text: em.reps + ' / ' + ex.r }),
        h('button', { class: 'bigbtn go', id: 'repBtn', text: '+1 REP', onclick: () => {
          em.reps = Math.min(ex.r, em.reps + 1);
          if (em.reps >= ex.r) { em.done = true; $('doneChk').checked = true; $('nextBtn').disabled = false; }
          $('repCount').textContent = em.reps + ' / ' + ex.r;
        } }),
        h('button', { class: 'tool', id: 'repMinus', text: '\u22121', onclick: () => { em.reps = Math.max(0, em.reps - 1); $('repCount').textContent = em.reps + ' / ' + ex.r; } }),
        h('label', { class: 'step' }, h('input', { type: 'checkbox', id: 'doneChk', checked: em.done, onchange: e => { em.done = e.target.checked; $('nextBtn').disabled = !em.done; } }), h('span', { text: 'I completed ' + ex.n })),
        h('button', { class: 'bigbtn', id: 'nextBtn', text: em.i < n - 1 ? 'NEXT: REST' : 'FINISH: START COOLDOWN', disabled: !em.done, onclick: () => {
          if (em.i < n - 1) { emSetPhase('rest'); } else { emSetPhase('cool'); }
        } }));
    } else if (em.phase === 'rest') {
      nodes.push(h('div', { class: 'eyebrow', text: 'REST \u00b7 NEXT: ' + EX[em.i + 1].n }), prog((em.i + 1) / n),
        h('div', { class: 'clock', id: 'emClock', text: clock(T.restSec * 1000) }),
        h('p', { class: 'lead', text: 'Breathe. Drink some water.' }),
        h('button', { class: 'bigbtn', id: 'skipRest', text: 'SKIP REST', onclick: () => { em.i += 1; emSetPhase('ex', { reps: 0, done: false }); } }));
      box.append(frame('Emergency Mode', nodes));
      emRun(Date.now() + T.restSec * 1000, () => { buzz(); em.i += 1; emSetPhase('ex', { reps: 0, done: false }); });
      return;
    } else if (em.phase === 'cool' || em.phase === 'act') {
      const label = em.phase === 'cool' ? 'COOLDOWN \u00b7 10 MINUTES' : em.label.toUpperCase();
      nodes.push(h('div', { class: 'eyebrow', text: label }), prog(1),
        h('div', { class: 'clock', id: 'emClock', text: clock(T.cooldownSec * 1000) }),
        h('p', { class: 'lead', text: em.phase === 'cool' ? 'Water. Slow breathing. Stay out of bed and out of your bedroom.' : 'Do this for the full 10 minutes.' }));
      box.append(frame('Emergency Mode', nodes));
      emRun(Date.now() + T.cooldownSec * 1000, () => {
        buzz();
        if (document.hidden && perm() === 'granted') showNotif({ title: 'DID YOU OVERCOME THE URGE?', body: 'Open the app and answer honestly.', hash: '#emergency', strong: true }, 'em-ask').catch(() => {});
        emSetPhase('ask');
      });
      return;
    } else if (em.phase === 'ask') {
      nodes.push(h('div', { class: 'ask', text: 'DID YOU OVERCOME THE URGE?' }),
        h('button', { class: 'bigbtn go', id: 'emYes', text: 'YES', onclick: emYes }),
        h('button', { class: 'bigbtn alt', id: 'emNo', text: 'NOT YET', onclick: () => { emLog('not-yet'); emSetPhase('notyet'); } }));
    } else if (em.phase === 'notyet') {
      nodes.push(h('p', { class: 'lead', text: 'That is okay. Keep going. What next?' }),
        h('button', { class: 'bigbtn', id: 'emRepeat', text: 'REPEAT THE ROUTINE', onclick: () => { em.logged = 'started'; emSetPhase('ex', { i: 0, reps: 0, done: false }); } }),
        h('button', { class: 'bigbtn alt', id: 'emOther', text: 'CHOOSE ANOTHER HEALTHY ACTIVITY', onclick: () => emSetPhase('pick') }));
    } else if (em.phase === 'pick') {
      nodes.push(h('p', { class: 'lead', text: 'Pick one. You will do it for 10 minutes.' }),
        ACTIVITIES.map((a, i) => h('button', { class: 'bigbtn alt act', id: 'act' + i, text: a, onclick: () => emSetPhase('act', { label: a }) })));
    }
    box.append(frame('Emergency Mode', nodes));
  }
  function emYes() {
    if (!em || em.final) return;
    em.final = true; emLog('overcame');
    if (window.__omw && window.__omw.isReady()) window.__omw.recordWin();
    else toast('Could not record the victory. The app is not ready.');
    closeSheet();
  }
  function openSOSIfIdle() { if (!em) openSOS(); }

  /* ---------------- 21-day protection ---------------- */
  function renderProt() {
    const box = $('sh-prot'); box.replaceChildren();
    const n = protDay(Date.now(), S), P = S.protection, nodes = [];
    if (!P.active) {
      nodes.push(h('p', { class: 'lead', text: 'A temporary high-alert period for 21 days. Days 2, 3, 4 and 7 are the hardest, so they get stronger reminders and high-alert mode. Your lifetime victories are never reset.' }),
        h('p', { class: 'note', text: 'Days change at 5:00 AM.' }),
        h('button', { class: 'bigbtn go', id: 'protStart', text: 'START 21-DAY PROTECTION (TODAY IS DAY 1)', onclick: () => {
          S.protection = { active: true, start: dayKey(shiftDay(Date.now())), extended: false, decided: false }; saveS(); renderProt(); renderMode(); toast('Protection started. Today is Day 1.'); } }));
    } else {
      nodes.push(h('div', { class: 'eyebrow', text: HARD.includes(n) ? 'HIGH-ALERT DAY' : 'PROTECTION ACTIVE' }),
        h('div', { class: 'reps', id: 'protDay', text: 'Day ' + n + (n > 21 ? ' (extended)' : ' / 21') }),
        h('div', { class: 'grid21' }, Array.from({ length: 21 }, (_, i) => i + 1).map(d => h('div', { class: 'tile' + (HARD.includes(d) ? ' hard' : '') + (d === n ? ' now' : '') + (d < n ? ' past' : ''), text: String(d) }))),
        h('p', { class: 'note', text: 'High-alert days: 2, 3, 4 and 7.' }),
        h('p', { class: 'lead', text: HARD.includes(n) ? 'Today is a hard day. Move your body, change rooms, keep Emergency Mode one tap away.' : 'Keep moving. Change your environment often.' }));
      if (n > 21 && !P.decided) {
        nodes.push(h('p', { class: 'lead', text: '21 days complete. Continue protection?' }),
          h('button', { class: 'bigbtn go', id: 'protCont', text: 'CONTINUE PROTECTION', onclick: () => { S.protection.decided = true; S.protection.extended = true; saveS(); renderProt(); renderMode(); } }),
          h('button', { class: 'bigbtn alt', id: 'protStopNow', text: 'STOP PROTECTION', onclick: () => { S.protection = { active: false, start: null, extended: false, decided: true }; saveS(); renderProt(); renderMode(); } }));
      }
      nodes.push(h('button', { class: 'tool', id: 'protStop', text: 'Stop protection', onclick: async () => {
        const ok = await window.__omw.ask({ title: 'Stop protection?', body: 'Protection reminders and high-alert days will end. Your victories are not affected.', ok: 'Stop', cancel: 'Keep it', danger: true });
        if (ok) { S.protection = { active: false, start: null, extended: false, decided: false }; saveS(); renderProt(); renderMode(); } } }));
    }
    box.append(frame('21-day protection', nodes));
  }
  let protAsked = false;
  async function protPrompt() {
    if (protAsked || !window.__omw) return;
    const n = protDay(Date.now(), S);
    if (S.protection.active && !S.protection.decided && n > 21) {
      protAsked = true;
      const cont = await window.__omw.ask({ title: '21 days complete', body: 'Do you want to continue protection mode?', ok: 'Continue', cancel: 'Stop' });
      S.protection.decided = true; S.protection.extended = cont;
      if (!cont) S.protection.active = false;
      saveS(); renderMode();
    }
  }

  /* ---------------- reminders & settings panel ---------------- */
  function icsText(days) {
    const now = Date.now(), list = occurrences(now, now + days * 864e5, S);
    const esc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const fold = l => { const o = []; while (l.length > 73) { o.push(l.slice(0, 73)); l = ' ' + l.slice(73); } o.push(l); return o.join('\r\n'); };
    const loc = ms => { const d = new Date(ms); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; };
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ONE MILLION WINS//Reminders//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:ONE MILLION WINS'];
    for (const o of list) {
      const m = message(o, S);
      L.push('BEGIN:VEVENT', 'UID:' + o.id.replace(/[^A-Za-z0-9@-]/g, '') + '-omw', 'DTSTAMP:' + stamp, 'DTSTART:' + loc(o.ts), 'DURATION:PT5M',
        fold('SUMMARY:' + esc(m.title)), fold('DESCRIPTION:' + esc(m.body || m.title)),
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(m.title), 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT');
    }
    L.push('END:VCALENDAR');
    return { text: L.join('\r\n') + '\r\n', count: list.length };
  }
  function downloadICS() {
    const { text, count } = icsText(28);
    const blob = new Blob([text], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'one-million-wins-reminders.ics'; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    toast(count + ' calendar reminders for the next 28 days saved.');
  }
  const timeIn = (val, cb, id) => h('input', { type: 'time', class: 'tin', value: val, id, onchange: e => { if (validTime(e.target.value)) { cb(e.target.value); saveS(); afterChange(); } else e.target.value = val; } });
  function afterChange() { renderMode(); syncTriggers(); const nx = $('nextRem'); if (nx) nx.textContent = nextText(); }
  function nextText() {
    if (!S.on) return 'Reminders are switched off.';
    const o = occurrences(Date.now(), Date.now() + 48 * 3600e3, S)[0];
    if (!o) return 'No reminder in the next 48 hours.';
    const m = message(o, S), d = new Date(o.ts);
    return 'Next: ' + d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + fmtTime(o.ts) + ' \u00b7 ' + m.title;
  }
  function renderRemind() {
    const box = $('sh-remind'); box.replaceChildren();
    const p = perm(), nodes = [];
    const permText = p === 'granted' ? 'Allowed' : p === 'denied' ? 'Blocked (change it in Chrome site settings)' : p === 'unsupported' ? 'Not supported here' : 'Not enabled yet';
    nodes.push(h('div', { class: 'card' },
      h('div', { class: 'kv' }, h('span', { text: 'Notifications' }), h('b', { id: 'permText', text: permText })),
      h('div', { class: 'kv' }, h('span', { text: 'Scheduled delivery when closed' }), h('b', { text: triggersSupported() ? 'Supported by this browser' : 'Not supported by this browser' })),
      h('p', { class: 'note', id: 'nextRem', text: nextText() }),
      h('div', { class: 'btnrow' },
        h('button', { class: 'tool', id: 'enableNotif', text: 'Enable notifications', onclick: async () => { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } renderRemind(); syncTriggers(); } }),
        h('button', { class: 'tool', id: 'testNotif', text: 'Send test notification', onclick: () => { if (perm() !== 'granted') return toast('Enable notifications first.'); showNotif({ title: 'ONE MILLION WINS', body: 'Test notification.', hash: '' }, 'test@' + Date.now()).catch(e => toast('Could not show it: ' + e.message)); } })),
      h('p', { class: 'warn', text: 'Honest limit: a web app cannot guarantee notifications while it is fully closed. Chrome only delivers these while the app is open or recently active in the background, and Android may freeze it. For reminders that fire reliably with the app closed, export them to your calendar below.' }),
      h('div', { class: 'btnrow' }, h('button', { class: 'tool', id: 'exportIcs', text: 'Export to calendar (.ics, 28 days)', onclick: downloadICS })),
      h('label', { class: 'step' }, h('input', { type: 'checkbox', id: 'masterOn', checked: S.on, onchange: e => { S.on = e.target.checked; saveS(); afterChange(); } }), h('span', { text: 'Reminders on' }))));

    const sleepRow = (label, key) => h('div', { class: 'row2' }, h('span', { text: label }), timeIn(S.sleep[key].start, v => { S.sleep[key].start = v; }, 'sl-' + key + '-s'), h('span', { text: 'to' }), timeIn(S.sleep[key].end, v => { S.sleep[key].end = v; }, 'sl-' + key + '-e'));
    nodes.push(h('h3', { text: 'Sleep hours (never disturbed)' }), sleepRow('Mon\u2013Fri', 'weekday'), sleepRow('Sat\u2013Sun', 'weekend'),
      h('p', { class: 'note', text: 'Reminders inside these hours are skipped. A reminder exactly at wake-up time still fires.' }));

    const remRows = grp => S.reminders.filter(r => r.group === grp).map(r => h('div', { class: 'row2' },
      h('input', { type: 'checkbox', checked: r.on, id: 'on-' + r.id, onchange: e => { r.on = e.target.checked; saveS(); afterChange(); } }),
      timeIn(r.time, v => { r.time = v; }, 'tm-' + r.id), h('span', { class: 'grow', text: r.title })));
    nodes.push(h('h3', { text: 'Before sleep' }), remRows('pre'), h('h3', { text: 'After waking' }), remRows('post'));

    nodes.push(h('h3', { text: 'Vulnerable window (High-Alert mode)' }),
      h('div', { class: 'row2' }, timeIn(S.vulnerable.start, v => { S.vulnerable.start = v; }, 'vu-s'), h('span', { text: 'to' }), timeIn(S.vulnerable.end, v => { S.vulnerable.end = v; }, 'vu-e')),
      h('h3', { text: 'Weekend high-alert' }),
      h('label', { class: 'step' }, h('input', { type: 'checkbox', id: 'wkOn', checked: S.weekendAlerts.on, onchange: e => { S.weekendAlerts.on = e.target.checked; saveS(); afterChange(); } }), h('span', { text: 'Saturday 5:00 AM \u2192 Monday 5:00 AM' })),
      h('div', { class: 'row2' }, h('span', { text: 'Every' }),
        h('select', { class: 'tin', id: 'wkEvery', onchange: e => { S.weekendAlerts.every = +e.target.value; saveS(); afterChange(); } }, [1, 2, 3, 4, 6].map(v => h('option', { value: v, selected: v === S.weekendAlerts.every, text: v + ' hour' + (v > 1 ? 's' : '') }))),
        h('span', { text: 'while awake' })));
    box.append(frame('Reminders', nodes));
  }

  /* ---------------- backup hooks ---------------- */
  function exportData() { return { settings: jget(KEY_S, null), history: hist() }; }
  function importData(plus) {
    if (!plus || typeof plus !== 'object') return;
    if (plus.settings && !lsGet(KEY_S)) { S = sanitize(plus.settings); saveS(); }
    const H = hist(), inc = plus.history || {};
    const ids = new Set(H.challenges.map(c => c.id));
    for (const c of (Array.isArray(inc.challenges) ? inc.challenges : [])) {
      if (c && typeof c.id === 'string' && !ids.has(c.id) && typeof c.startedAt === 'number' && ['open', 'on-time', 'late', 'timeout'].includes(c.status)) H.challenges.push({ id: c.id, startedAt: c.startedAt, endAt: +c.endAt || c.startedAt, doneAt: c.doneAt || null, status: c.status, secs: c.secs == null ? null : +c.secs });
    }
    const eids = new Set(H.emergencies.map(c => c.id));
    for (const e of (Array.isArray(inc.emergencies) ? inc.emergencies : [])) {
      if (e && typeof e.id === 'string' && !eids.has(e.id) && typeof e.ts === 'number') H.emergencies.push({ id: e.id, ts: e.ts, outcome: String(e.outcome || '').slice(0, 20) });
    }
    H.challenges.sort((a, b) => a.startedAt - b.startedAt); H.emergencies.sort((a, b) => a.ts - b.ts);
    saveHist(H); renderMode();
  }

  /* ---------------- routing (notification taps, shortcuts) ---------------- */
  function route(hash) {
    const x = (hash || '').replace('#', '');
    if (!['emergency', 'challenge', 'challenge-start'].includes(x)) return;
    if (x === 'emergency') openSOSIfIdle(); else openChallenge(x === 'challenge-start');
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
  }

  /* ---------------- wire up ---------------- */
  $('sos').addEventListener('click', openSOSIfIdle);
  $('openChallenge').addEventListener('click', () => openChallenge(false));
  $('openRemind').addEventListener('click', () => { openSheet('sh-remind'); renderRemind(); });
  $('openProt').addEventListener('click', () => { openSheet('sh-prot'); renderProt(); });
  window.addEventListener('hashchange', () => route(location.hash));
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'omw-open') route(e.data.hash); }); } catch (e) { /* ignore */ }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); renderMode(); syncTriggers(); protPrompt(); } });
  setInterval(tick, 15000);
  setInterval(renderMode, 30000);

  window.OMWPlus = {
    exportData, importData, T,
    mode: () => mode(Date.now(), S),
    settings: () => S,
    upcoming: hours => occurrences(Date.now(), Date.now() + hours * 3600e3, S).map(o => Object.assign({ ts: o.ts, id: o.id }, message(o, S))),
    icsText, tick, triggersSupported
  };

  renderMode();
  chalNormalize();
  tick();
  syncTriggers();
  setTimeout(protPrompt, 1500);
  route(location.hash);
})();
</script>
</body>
